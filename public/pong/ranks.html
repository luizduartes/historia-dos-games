<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>História dos Jogos - Login</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/pong-ranks.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <main class="centralized-main">
        <div class="terminal-box decoration-terminal-box ranks-terminal-box">
            <i class="fa-solid fa-chevron-left corner-icon corner-icon1"></i>
            <i class="fa-solid fa-chevron-left corner-icon corner-icon2"></i>
            <i class="fa-solid fa-chevron-left corner-icon corner-icon3"></i>
            <i class="fa-solid fa-chevron-left corner-icon corner-icon4"></i>

            <div class="profile-box-top">
                <div class="profile-box-top-left">
                    <div class="terminal-command">
                        <i class="fa-solid fa-angle-right"></i>
                        <span>RANKINGS</span>
                    </div>
                </div>
                <div class="profile-box-top-right">
                    <span class="terminal-text">SISTEMA HISTGAMES v1.0</span>
                    <div class="terminal-box-top-buttons">
                        <button class="terminal-box-top-button terminal-box-top-disabled-button">
                            <i class="fa-solid fa-window-minimize"></i>
                        </button>
                        <button class="terminal-box-top-button terminal-box-top-disabled-button">
                            <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                        </button>
                        <a href="../index.html">
                            <button class="terminal-box-top-button">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </a>
                    </div>
                </div>
            </div>

            <div class="terminal-line"></div>

            <div class="profile-box-main-content ranks-box-main-content">
                <div class="terminal-box ranks-box-main-content-part ranks-box-main-content-left">
                    <span>RANKING ATUAL</span>
                    <div class="rank-selector-buttons-wrapper">
                        <button class="rank-selector-button rank-selector-button-active">
                            <i class="fa-solid fa-trophy"></i>
                            <span>VITÓRIAS<br>TOTAIS</span>
                        </button>
                        <button class="rank-selector-button">
                            <i class="fa-solid fa-fire"></i>
                            <span>WIN<br>STREAK</span>
                        </button>
                        <button class="rank-selector-button">
                            <i class="fa-solid fa-stopwatch"></i>
                            <span>VITÓRIAS<br>MAIS RÁPIDAS</span>
                        </button>
                        <button class="rank-selector-button">
                            <i class="fa-solid fa-clock"></i>
                            <span>TEMPO TOTAL<br>JOGADO</span>
                        </button>
                    </div>
                    <div class="rank-container">
                        <div class="rank">
                            <div class="grid-rank rank-labels">
                                <span>POSIÇÃO</span>
                                <span>JOGADOR</span>
                                <span>VITÓRIAS</span>
                            </div>
                            <div class="terminal-dashed-line"></div>
                            <div class="grid-rank rank-positions">
                                <span>1.</span>
                                <span>player10</span>
                                <span class="rank-score">210</span>
                                
                                <span>2.</span>
                                <span>player33</span>
                                <span class="rank-score">200</span>
                                
                                <span>3.</span>
                                <span>player17</span>
                                <span class="rank-score">100</span>
                                
                                <span>4.</span>
                                <span>player009</span>
                                <span class="rank-score">90</span>
                                
                                <span>5.</span>
                                <span>player06</span>
                                <span class="rank-score">88</span>
                                
                                <span>6.</span>
                                <span>player1212</span>
                                <span class="rank-score">79</span>
                                
                                <span>7.</span>
                                <span>player117</span>
                                <span class="rank-score">77</span>
                                
                                <span>8.</span>
                                <span>player220</span>
                                <span class="rank-score">72</span>
                                
                                <span>9.</span>
                                <span>player111</span>
                                <span class="rank-score">64</span>
                                
                                <span>10.</span>
                                <span>player11</span>
                                <span class="rank-score">52</span>
                            </div>
                        </div>
                        <div class="grid-rank rank-player-position">
                            <span>25.</span>
                            <span>eu</span>
                            <span class="rank-score">14</span>
                        </div>
                    </div>
                </div>
                <div class="terminal-box ranks-box-main-content-part ranks-box-main-content-right"></div>
            </div>

            <div class="terminal-dashed-line"></div>

            <div class="profile-box-bottom">
                <div class="terminal-command">
                    <i class="fa-solid fa-angle-right"></i>
                    <span>DICA: JOGUE MAIS E SUBA NOS RANKINGS!</span>
                </div>
                <div class="profile-box-bottom-buttons">
                    <a href="../index.html">
                        <button class="profile-box-bottom-button">
                            <i class="fa-solid fa-house"></i>
                            <span>VOLTAR PARA AS ERAS</span>
                        </button>
                    </a>
                    <a href="./game.html">
                        <button class="profile-box-bottom-button">
                            <i class="fa-solid fa-gamepad"></i>
                            <span>JOGAR O PONG</span>
                        </button>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
